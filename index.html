<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kavya's design-token stylesheet using CSS custom properties.">
  <title>Kavya's Design Tokens with CSS Variables</title>

  <style>
    /* ===== DESIGN TOKENS ===== */
    :root {
      /* Colours */
      --color-primary: #3d5af1;
      --color-primary-dark: #2b3fb5;
      --color-accent: #ff6b6b;
      --color-bg: #f5f7ff;
      --color-surface: #ffffff;
      --color-text: #1f2430;
      --color-muted: #6b7280;

      /* Font sizes */
      --fs-sm: .8rem;
      --fs-base: 1rem;
      --fs-md: 1.25rem;
      --fs-lg: 1.563rem;
      --fs-xl: 1.953rem;
      --fs-2xl: 2.441rem;

      /* Spacing, radius, shadow */
      --space-1: .25rem;
      --space-2: .5rem;
      --space-3: 1rem;
      --space-4: 1.5rem;
      --space-5: 2.5rem;
      --radius: 10px;
      --shadow: 0 4px 14px rgba(31, 36, 48, .12);
      --font-body: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    /* Dark theme */
    [data-theme="dark"] {
      --color-bg: #12141c;
      --color-surface: #1e2230;
      --color-text: #eef0f7;
      --color-muted: #9aa3b5;
    }

    /* ===== BASE ===== */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: var(--space-4);
      font: var(--fs-base)/1.6 var(--font-body);
      background: var(--color-bg);
      color: var(--color-text);
      transition: background .3s, color .3s;
    }

    h1 {
      font-size: var(--fs-2xl);
      margin: 0 0 var(--space-3);
    }

    h2 {
      font-size: var(--fs-lg);
      margin: 0 0 var(--space-3);
    }

    p {
      margin: var(--space-2) 0;
    }

    small {
      font-size: var(--fs-sm);
      color: var(--color-muted);
    }

    /* ===== COMPONENTS ===== */
    .btn {
      background: var(--color-primary);
      color: #fff;
      border: 0;
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius);
      font-size: var(--fs-base);
      cursor: pointer;
    }

    .btn:hover {
      background: var(--color-primary-dark);
    }

    .btn--accent {
      background: var(--color-accent);
    }

    .card {
      background: var(--color-surface);
      color: var(--color-text);
      padding: var(--space-4);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-block: var(--space-4);
    }

    .swatches {
      display: flex;
      gap: var(--space-3);
      flex-wrap: wrap;
    }

    .swatch {
      width: 90px;
      height: 60px;
      border-radius: var(--radius);
      display: grid;
      place-items: end start;
      padding: var(--space-1);
      font-size: var(--fs-sm);
      color: #fff;
    }

    .type-example {
      margin: var(--space-2) 0;
      line-height: 1.4;
    }

    .type-xl {
      font-size: var(--fs-xl);
    }

    .type-lg {
      font-size: var(--fs-lg);
    }

    .type-md {
      font-size: var(--fs-md);
    }

    .type-base {
      font-size: var(--fs-base);
    }

    .type-sm {
      font-size: var(--fs-sm);
      color: var(--color-muted);
    }

    @media (max-width: 600px) {
      body {
        padding: var(--space-3);
      }

      h1 {
        font-size: var(--fs-xl);
      }

      .card {
        padding: var(--space-3);
      }
    }
  </style>
</head>

<body>

  <h1>Kavya's Design Token Sheet</h1>
  <p>BCA Cloud Computing · Web Development</p>

  <button class="btn"
    onclick="document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? '' : 'dark'">
    Toggle dark theme
  </button>

  <div class="card">
    <h2>Colours</h2>

    <div class="swatches">
      <div class="swatch" style="background:var(--color-primary)">primary</div>
      <div class="swatch" style="background:var(--color-primary-dark)">dark</div>
      <div class="swatch" style="background:var(--color-accent)">accent</div>
      <div class="swatch" style="background:var(--color-muted)">muted</div>
    </div>
  </div>

  <div class="card">
    <h2>Type Scale</h2>

    <p class="type-example type-xl">Extra large – --fs-xl</p>
    <p class="type-example type-lg">Large – --fs-lg</p>
    <p class="type-example type-md">Medium – --fs-md</p>
    <p class="type-example type-base">Base – --fs-base</p>
    <p class="type-example type-sm">Small – --fs-sm</p>
  </div>

  <div class="card">
    <h2>Buttons</h2>

    <button class="btn">Primary</button>
    <button class="btn btn--accent">Accent</button>
  </div>

</body>

</html>
